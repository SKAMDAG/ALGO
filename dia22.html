<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>22 No cumpleaños.💙</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,system-ui}

/* PANTALLAS */
.screen{
  position:absolute;
  width:100%;
  height:100vh;
  display:none;
  justify-content:center;
  align-items:center;
  flex-direction:column;
}
.active{display:flex}

/* 🔒 LOCKSCREEN */
#lock{
  background:linear-gradient(180deg,#0f2027,#203a43,#2c5364);
  color:white;
}

.timeBig{
  font-size:75px;
  margin-top:100px;
  font-weight:200;
}

/* NOTIFICACION */
.notif{
  margin-top:40px;
  width:85%;
  background:rgba(255,255,255,0.15);
  backdrop-filter:blur(15px);
  border-radius:18px;
  padding:12px;
  cursor:pointer;
  animation:slide 0.5s ease;
}
.notif-top{font-size:12px;opacity:0.7}
.notif-name{font-weight:bold}
.notif-msg{font-size:13px;opacity:0.9}

@keyframes slide{
  from{transform:translateY(-20px);opacity:0}
  to{transform:translateY(0);opacity:1}
}

.tap{
  position:absolute;
  bottom:100px;
  opacity:0.6;
  font-size:14px;
}

/* 🔢 PIN */
#pin{background:black;color:white}

.dots{margin:20px}
.dot{
  width:14px;height:14px;
  border-radius:50%;
  border:1px solid #aaa;
  display:inline-block;
  margin:6px;
}
.filled{background:white}

.keypad{
  display:grid;
  grid-template-columns:repeat(3,80px);
  gap:18px;
}
.key{
  width:80px;height:80px;
  border-radius:50%;
  background:#1c1c1e;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:24px;
}

/* 📱 PHONE */
#phone{
  width:340px;
  height:620px;
  background:#efeae2;
  border-radius:25px;
  overflow:hidden;
  display:flex;
  flex-direction:column;
  box-shadow:0 10px 30px rgba(0,0,0,0.4);
}

/* HEADER */
#header{
  background:#075e54;
  color:white;
  padding:10px;
  display:flex;
  gap:10px;
  align-items:center;
}
#avatar{
  width:35px;height:35px;
  border-radius:50%;
  background:url('iaa.jpeg') center/cover;
  cursor:pointer;
}
#name{font-weight:bold}
#status{font-size:11px;opacity:0.8}

/* CHAT */
#chat{
  flex:1;
  padding:10px;
  overflow-y:auto;
  display:flex;
  flex-direction:column;
  background:url('ai3.jpg') center/cover;
}

/* MENSAJES */
.msg{
  max-width:75%;
  padding:8px 10px;
  margin:6px 0;
  border-radius:10px;
  font-size:14px;
}
.me{background:#dcf8c6;align-self:flex-end}
.other{background:white;align-self:flex-start}

.time{
  font-size:10px;
  text-align:right;
  color:#666;
}

.check{
  color:#34b7f1; /* AZUL */
  margin-left:4px;
}
.keypad div:empty{
  background:transparent;
  box-shadow:none;
}
/* INFO */
#contact{
  background:#111;
  color:white;
  text-align:center;
}
#contact img{
  width:120px;
  border-radius:50%;
  margin-bottom:20px;
}
#inputArea{
  display:flex;
  padding:8px;
  background:#f0f0f0;
}

#inputMsg{
  flex:1;
  padding:10px;
  border-radius:20px;
  border:none;
  outline:none;
}

#inputArea button{
  margin-left:8px;
  border:none;
  background:#075e54;
  color:white;
  border-radius:50%;
  width:40px;
  height:40px;
  cursor:pointer;
}
</style>
</head>
<script>

fechaDesbloqueo.setDate(fechaInicio.getDate() + (diaActual-1));

<body>

<!-- 🔒 LOCK -->
<div id="lock" class="screen active">
  <div class="timeBig" id="time"></div>

  <div class="notif" onclick="openNotif()">
    <div class="notif-top">💬 WhatsApp</div>
    <div class="notif-name">🎨🩵🫧</div>
    <div class="notif-msg"></div>
  </div>

</div>

<!-- 🔢 PIN -->
<div id="pin" class="screen">

  <div class="dots" id="dots"></div>

  <div class="keypad">

    <div class="key" onclick="press(2)">2</div>
    <div class="key" onclick="press(3)">3</div>
    <div class="key" onclick="press(4)">4</div>
    <div class="key" onclick="press(5)">5</div>
    <div class="key" onclick="press(6)">6</div>
    <div class="key" onclick="press(7)">7</div>
    <div class="key" onclick="press(8)">8</div>
    <div class="key" onclick="press(9)">9</div>
     <div></div>

  </div>

<!-- 💬 APP -->

    <div id="chat"></div>
<div id="inputArea">

</div>
  </div>
</div>

<div id="contact" class="screen" onclick="goIndex()">

  <h2>🎨🩵🫧</h2>

</div>
<script>

// hora
setInterval(()=>{
  let d=new Date();
  time.innerText=d.getHours()+":"+String(d.getMinutes()).padStart(2,'0');
},1000);

// pantallas
function show(id){
  document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}

// abrir desde notificacion
function openNotif(){
  show("pin");
}

// PIN
let code="";
let correct="301820";

function press(n){
  if(code.length<6){
    code+=n;
    draw();
  }
  if(code.length==6){
    if(code===correct){
      show("app");
    }else{
      code="";
      draw();
    }
  }
}

function draw(){
  dots.innerHTML="";
  for(let i=0;i<6;i++){
    let d=document.createElement("div");
    d.className="dot"+(i<code.length?" filled":"");
    dots.appendChild(d);
  }
}

// CHAT
const chat = document.getElementById('chat');
const status = document.getElementById('status');

const conversation = [
  {text:"Primer mes.", type:"me"},
 {text:"Buenos días mi niña hermosa ☀️, espero que hayas amanecido muy bien, que haya soñado con los angelitos. Muchas felicidades en nuestro primer mes, te amo mucho mi reina, eres una dama muy maravillosa y hermosa tanto en lo físico como en el interior, en verdad espero de todo corazón que el Señor nos permita una vida juntos, una relación próspera y que él nos dé la fuerza para superar cada obstáculo que se nos presente. Te amo muchísimo mi reina 💗💗😘😘", type:"other"},
 {text:"Segundo mes.", type:"me"},
 {text:"Ya son dos meses gracias a Dios mi reina, y no dos meses cualquiera, porque han sido de los meses más lindos de mi vida, te amo muchísimo mi reina hermosa 💗😘", type:"other"},
 {text:"Tercer mes.", type:"me"},
 {text:"En verdad agradezco mucho a Dios por permitirme tener como novia y futura esposa a una persona tan maravillosa como tú, y muchas gracias a ti también por hacerme sentir el novio más afortunado y por demostrarme lo hermoso que es sentirse amado por una hermosa dama como tú, dicen que a partir de los tres meses comienzan los problemas de las mayorías de parejas, pero yo confío que en nuestro caso Dios mediante es apena el comienzo de muchas aventuras juntos y que si se nos presenta cualquier situación el Señor nos dará el entendimiento necesario para poder resolverlo y que nuestro amor se fortalezca cada vez más. Te amo mucho, mucho mi niña 🫶🏽😘", type:"other"},
 {text:"Cuarto mes.", type:"me"},
 {text:"Hoy hace 4 meses me convertí en el novio más afortunado, porque el Señor me regaló una hermosa persona como novia, una que no solo es hermosa físicamente, también cuenta con una hermosa personalidad, ella se adueñó de mi corazón, pero nunca me había sentido tan feliz de que alguien se adueñara de mí corazón, ella también es la primera persona en que pienso cuando me levanto y la protagonista de mi imaginación en el día. Esa hermosa dama de la les hablo es la persona que se ha ganado mi confianza de una forma que hasta yo mismo me he impresionado, si así mismo como están leyendo hasta yo mismo me he impresionado. Pero eso no es todo, porque también yo nunca pensé que iba a tener una escritora favorita, y adivinen que?? Esa hermosa dama de la que les hablo, esa preciosura de persona, se convirtió en mi escritora favorita. Pero yo lo voy a dejar hasta aquí, porque si no creo que duraría el día entero hablándoles de lo increíble que es mi novia. Feliz cuatro meses mi amor hermoso, te amo muchísimo mi reina preciosa❤️❤️❤️😘😘😘", type:"other"},
 {text:"Sexto mes.", type:"me"},
 {text:"Hoy en este día tan especial y bonito, me siento muy feliz, porque siento estos 6 meses de relación junto a las niña más bella, cómo un logro más en mi vida. Parece increíble lo rápido que puede cambiar todo y de una forma tan bonita, porque estos seis meses han sido de los más especiales y hermosos de mi vida. Mi amor, mi reina, mi princesa, mi niña, mi preciosura, mi todo, te amo muchísimo y definitivamente puedo decir que eres una ladrona muy experta por la forma en que te rebotaste mi corazón, pero sin duda alguna dejaría que te lo robes todas las veces que quieras, porque nunca mi corazón se había sentido tan pleno y feliz como se siente junto a ti. Feliz 6 meses mi reina hermosa 👑❤️😘", type:"other"},
  {text:"Septimo mes.", type:"me"},
 {text:"Increíblemente ya tenemos 7 meses de relación, aveces miro hacía atrás y pienso que pareciera que fue ayer cuando iniciamos. Se que aveces podemos tener problemas, alguna que otra diferencias, momentos un poco tensos e incómodos, se que aveces puedo ser muy intenso, muy molestoso o también aveces tocos teclas que te hacen sentir mal o insegura, lo cual para nada es mi intención mi amor, en verdad discúlpame, son cosas en la que definitivamente tengo que trabajar porque sin duda alguna, a pesar de nuestras altas y bajas eres esa hermosa dama con la cual quiero pasar el resto de mi vida, eres esa dama que me impulsa a cada día ser mejor persona, esa dama por la cual cada día siento más amor. Te amo muchísimo mi reina bella, feliz 7 meses 👑👑❤️❤️.", type:"other"},
  {text:"Octavo mes.", type:"me"},
 {text:"Yo iba a escribir el mensaje ayer antes de acostarme para así enviártelo cuando me despertara, pero el sueño me ganó 🥲. Con cada día que pasa no podría estar más agradecido de tener como novia, cada día te amo más, cada Día me siento más orgulloso de la increíble novia que tengo. Para eres ese ser increíblemente bello que ilumina mis mañanas con solo leer tus mensajes, eres una obra de arte única, sincera aveces no encuentro las palabras para describir lo especial y única que eres. Te amo muchísimo mi amor. Aveces me pongo a pensar que yo soy uno de los favoritos de Dios que me mando una novia con cualidades tan hermosas como las tuyas. En fin, ya está bueno, “demasiado cursileria” dice mi novia. Te amo mi reina preciosa 👑👑💜💜", type:"other"},
  {text:"Noveno mes.", type:"me"},
 {text:"El gueso baby !!!, Yo no me había percatado que hoy estamos a 20, yo juraba que estábamos a 17, ay baby perdón, yo no sé si tú te acordaste y esperaste a ver si yo me acordaba, pero feliz nueve meses mi amor, eres lo mejor me ha pasado. Yo nunca he jugado la lotería, pero aún así considero que ya me la gane el día que nos hicimos novio. En verdad me siento mal, discúlpame, no sé cómo se me había pasado una fecha tan importante. Te amo mucho más de lo que te imaginas mi reina preciosa. Eres ese regalo del que nunca me canso de dar gracias a Dios por tenerlo o ese tesoro del cual siempre cuidaré por lo increíble que eres. 💜👑😘", type:"other"},
  {text:"Decimo mes.", type:"me"},
 {text:"Hola mi niña hermosa, no sé si te acuerdas, pero hoy estamos a 20 y ya estamos a solo dos meses de cumplir nuestro primer aniversario de novios, algo que sin duda alguna me ilusiona mucho porque cada día tu hechizo me tiene más enamorado, creo que nunca me había sentido tan feliz de sentirme enamorado de alguien, sin duda alguna has sido los más lindo que ha conquistado mi corazón, eres ese ser maravilloso tan maravilloso que ilumina mi día a día, cada vez que pienso en nuestra relación quisiera que llegaran a mi mente las palabras hermosas para poder describirla, porque sinceramente a lo que siento por ti que la frase Buzz Lightyear de “hasta el infinito y más allá” le queda muy corta. Te amo muchísimo mi reina preciosa💜💜👑👑😘😘.", type:"other"},
];

let i = 0;

function getTime(){
  const d = new Date();
  return d.getHours()+":"+String(d.getMinutes()).padStart(1,'0');
}

function addMessage(data){
  const m = document.createElement('div');
  m.classList.add('msg', data.type);

  const text = document.createElement('div');
  text.textContent = data.text;

  const timeDiv = document.createElement('div');
  timeDiv.classList.add('time');

  // CHECKS SOLO PARA "me"
  if(data.type === "me"){
    const checks = document.createElement("span");
    checks.innerHTML = "✔";
    checks.style.marginLeft = "4px";

    timeDiv.innerHTML = getTime();
    timeDiv.appendChild(checks);

    // animación
    setTimeout(()=>{
      checks.innerHTML = "✔✔";
      checks.style.color = "gray";
    },800);

    setTimeout(()=>{
      checks.style.color = "#34b7f1";
    },1600);

  }else{
    timeDiv.innerHTML = getTime();
  }

  m.appendChild(text);
  m.appendChild(timeDiv);

  // ❤️ reaccion con doble click
  m.ondblclick = ()=>{
    if(!m.querySelector(".react")){
      const r = document.createElement("div");
      r.innerText = "❤️";
      r.style.fontSize="14px";
      m.appendChild(r);
    }
  };

  chat.appendChild(m);
  chat.scrollTop = chat.scrollHeight;
}

function nextMessage(){
  if(i >= conversation.length) return;

  const data = conversation[i];

  if(data.type === "other"){
    status.textContent = "escribiendo...";

    setTimeout(()=>{
      status.textContent = "en línea";
      addMessage(data);
      i++;
      setTimeout(nextMessage, 1200);
    },1500);

  }else{
    addMessage(data);
    i++;
    setTimeout(nextMessage, 1200);
  }
}

// INICIAR
nextMessage();

// PROFILE → INDEX
document.getElementById("avatar").onclick=()=>{
  show("contact");
};

function goIndex(){
  window.location.href="index.html";
}
</Script>
</body>
</html>
